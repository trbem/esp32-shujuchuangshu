<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 遥测与按需采集</title>
<style>
body{margin:0;background:#101723;color:#eaf0fb;font:15px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1,h2{margin:0 0 16px}.toolbar,.cards{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar{margin-bottom:16px}input,select,button,a{padding:9px;border-radius:7px;border:1px solid #3a4b66;background:#192536;color:inherit}button,a{cursor:pointer;text-decoration:none}.primary{background:#1769d2}.warn{background:#754d00}.cards{margin-bottom:16px}.card,section{background:#192536;padding:13px;border-radius:8px}.card{min-width:150px}.label{color:#9bb0ce;font-size:12px}.value{font-size:21px;margin-top:4px}section{margin:14px 0}canvas{width:100%;height:220px;background:#111b2a;border-radius:5px}#status{color:#9bb0ce}.hint{color:#9bb0ce;font-size:13px;line-height:1.55}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #30415b;padding:8px;text-align:left}.pill{border-radius:12px;padding:3px 8px;background:#30415b;white-space:nowrap}.completed{background:#176b3a}.failed,.timeout{background:#80343b}.received{background:#315f9f}.submitted{background:#8b6518}
</style>
<main><h1>ESP32 遥测与按需采集</h1>
<section><h2>历史数据</h2><p class="hint">“刷新已存数据”只读取 SQLite 历史记录，不会向设备发送请求。</p><div class="toolbar"><label>开始 <input id="start" type="datetime-local"></label><label>结束 <input id="end" type="datetime-local"></label><button id="refresh">刷新已存数据</button><a id="export" href="#">导出 CSV</a><span id="status"></span></div><div class="cards"><div class="card"><div class="label">最新温度</div><div class="value" id="temp">—</div></div><div class="card"><div class="label">最新 RSSI</div><div class="value" id="rssi">—</div></div><div class="card"><div class="label">记录数</div><div class="value" id="count">0</div></div></div><div>温度（°C）</div><canvas id="temperature"></canvas><div>加速度（g）：X / Y / Z</div><canvas id="accel"></canvas></section>
<section><h2>采集一次最新数据</h2><p class="hint">此操作创建一个带 request_id 的完整快照任务。设备收到后会回执并回传新的观测；与上方刷新历史不同。</p><div class="toolbar"><label>目标设备 <select id="device"></select></label><button class="primary" id="capture">采集一次最新数据</button><button class="warn" id="toggle">暂停周期遥测入库</button><span id="taskStatus"></span></div><table><thead><tr><th>请求 ID</th><th>设备</th><th>状态</th><th>创建 / 接收 / 完成</th><th>关联观测</th><th>说明</th></tr></thead><tbody id="tasks"></tbody></table></section></main>
<script>
const $=id=>document.getElementById(id),now=new Date(),ago=new Date(now-86400000),local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('start').value=local(ago);$('end').value=local(now);const fmt=n=>n?new Date(n).toLocaleTimeString():'—';
function ms(id){const v=$(id).value;return v?new Date(v).getTime():''}function draw(id,series){const c=$(id),r=devicePixelRatio||1,w=c.clientWidth*r,h=c.clientHeight*r;c.width=w;c.height=h;const x=c.getContext('2d');x.clearRect(0,0,w,h);if(!series[0]?.values.length)return;const all=series.flatMap(s=>s.values),lo=Math.min(...all),hi=Math.max(...all),span=hi-lo||1,n=series[0].values.length;series.forEach(s=>{x.strokeStyle=s.color;x.lineWidth=2;x.beginPath();s.values.forEach((v,i)=>{const px=i*w/Math.max(1,n-1),py=h-8-(v-lo)/(span)*Math.max(1,h-18);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}
async function load(){const q=new URLSearchParams({limit:20000});if(ms('start'))q.set('start_ms',ms('start'));if(ms('end'))q.set('end_ms',ms('end'));$('status').textContent='读取已存数据…';const data=await fetch('/api/v1/telemetry?'+q).then(r=>r.json());const a=data.samples;$('count').textContent=a.length;$('status').textContent=a.length?'已刷新，不会向设备发送请求':'暂无已存数据';const last=a.at(-1);if(last){$('temp').textContent=last.temp_c.toFixed(1)+' °C';$('rssi').textContent=last.rssi+' dBm'}draw('temperature',[{values:a.map(x=>x.temp_c),color:'#f2a65a'}]);draw('accel',[{values:a.map(x=>x.accel_x_g),color:'#62c5ff'},{values:a.map(x=>x.accel_y_g),color:'#7be495'},{values:a.map(x=>x.accel_z_g),color:'#ff7eb6'}]);$('export').href='/api/v1/export.csv?'+q}
async function devices(){const data=await fetch('/api/v1/devices').then(r=>r.json());const old=$('device').value,ds=data.devices.length?data.devices:[{device_id:'s3eye-001'}];$('device').innerHTML=ds.map(d=>`<option value="${d.device_id}">${d.device_id}</option>`).join('');$('device').value=old||ds[0].device_id}
async function tasks(){const data=await fetch('/api/v1/capture-tasks').then(r=>r.json());$('tasks').innerHTML=data.tasks.map(t=>`<tr><td title="${t.request_id}">${t.request_id.slice(0,8)}…</td><td>${t.device_id}</td><td><span class="pill ${t.status}">${t.status}</span></td><td>${fmt(t.created_at_ms)} / ${fmt(t.received_at_ms)} / ${fmt(t.completed_at_ms)}</td><td>${t.telemetry_id?`#${t.telemetry_id}`:'—'}</td><td>${t.error||t.sensor_sources}</td></tr>`).join('')||'<tr><td colspan="6">尚未创建任务</td></tr>'}
async function state(){const s=await fetch('/api/v1/control/periodic-ingestion').then(r=>r.json());$('toggle').textContent=s.paused?'恢复周期遥测入库':'暂停周期遥测入库';$('toggle').dataset.paused=s.paused}
$('capture').onclick=async()=>{const r=await fetch('/api/v1/capture-tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:$('device').value})});const t=await r.json();$('taskStatus').textContent=`已提交 ${t.request_id}`;tasks()};$('toggle').onclick=async()=>{const paused=$('toggle').dataset.paused!=='true';await fetch('/api/v1/control/periodic-ingestion',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({paused})});state()};$('refresh').onclick=load;Promise.all([load(),devices(),tasks(),state()]);setInterval(tasks,1000);
</script>
