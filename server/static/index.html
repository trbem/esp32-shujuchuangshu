<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 遥测历史</title>
<style>
body{margin:0;background:#101723;color:#eaf0fb;font:15px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{margin:0 0 16px}.toolbar,.cards{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar{margin-bottom:16px}input,button,a{padding:9px;border-radius:7px;border:1px solid #3a4b66;background:#192536;color:inherit}button,a{cursor:pointer;text-decoration:none}.cards{margin-bottom:16px}.card{background:#192536;padding:13px;border-radius:8px;min-width:150px}.label{color:#9bb0ce;font-size:12px}.value{font-size:21px;margin-top:4px}section{background:#192536;padding:14px;border-radius:8px;margin:14px 0}canvas{width:100%;height:220px;background:#111b2a;border-radius:5px}#status{color:#9bb0ce}
</style>
<main><h1>ESP32 遥测历史</h1><div class="toolbar"><label>开始 <input id="start" type="datetime-local"></label><label>结束 <input id="end" type="datetime-local"></label><button id="refresh">查询</button><a id="export" href="#">导出 CSV</a><span id="status"></span></div>
<div class="cards"><div class="card"><div class="label">最新温度</div><div class="value" id="temp">—</div></div><div class="card"><div class="label">最新 RSSI</div><div class="value" id="rssi">—</div></div><div class="card"><div class="label">记录数</div><div class="value" id="count">0</div></div></div>
<section><div>温度（°C）</div><canvas id="temperature"></canvas></section><section><div>加速度（g）：X / Y / Z</div><canvas id="accel"></canvas></section><section><div>内存：内部 SRAM / PSRAM（MiB）</div><canvas id="memory"></canvas></section></main>
<script>
const $=id=>document.getElementById(id), now=new Date(), ago=new Date(now-86400000); const local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16); $('start').value=local(ago);$('end').value=local(now);
function ms(id){const v=$(id).value;return v?new Date(v).getTime():''} function draw(id,series){const c=$(id),r=devicePixelRatio||1,w=c.clientWidth*r,h=c.clientHeight*r;c.width=w;c.height=h;const x=c.getContext('2d');x.clearRect(0,0,w,h);if(!series[0]?.values.length)return;const all=series.flatMap(s=>s.values),lo=Math.min(...all),hi=Math.max(...all),span=hi-lo||1,n=series[0].values.length;x.strokeStyle='#30435f';x.beginPath();x.moveTo(0,h-1);x.lineTo(w,h-1);x.stroke();series.forEach(s=>{x.strokeStyle=s.color;x.lineWidth=2;x.beginPath();s.values.forEach((v,i)=>{const px=i*w/Math.max(1,n-1),py=h-8-(v-lo)/(span)*Math.max(1,h-18);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});x.fillStyle='#9bb0ce';x.font=`${12*r}px system-ui`;x.fillText(`${hi.toFixed(2)} … ${lo.toFixed(2)}`,8,14*r)}
async function load(){const q=new URLSearchParams({limit:20000});if(ms('start'))q.set('start_ms',ms('start'));if(ms('end'))q.set('end_ms',ms('end'));$('status').textContent='加载中…';const data=await fetch('/api/v1/telemetry?'+q).then(r=>r.json());const a=data.samples;$('count').textContent=a.length;$('status').textContent=a.length?'':'暂无数据';const last=a.at(-1);if(last){$('temp').textContent=last.temp_c.toFixed(1)+' °C';$('rssi').textContent=last.rssi+' dBm'}draw('temperature',[{values:a.map(x=>x.temp_c),color:'#f2a65a'}]);draw('accel',[{values:a.map(x=>x.accel_x_g),color:'#62c5ff'},{values:a.map(x=>x.accel_y_g),color:'#7be495'},{values:a.map(x=>x.accel_z_g),color:'#ff7eb6'}]);draw('memory',[{values:a.map(x=>x.heap_int/1048576),color:'#62c5ff'},{values:a.map(x=>x.heap_psram/1048576),color:'#7be495'}]);$('export').href='/api/v1/export.csv?'+q}
$('refresh').onclick=load;load();setInterval(load,30000);
</script>
